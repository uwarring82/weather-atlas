name: Collect weather and publish Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: weather-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check normalization and browser JavaScript
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node tests/ui-smoke.cjs
      - name: Collect recent observations and forecasts
        # An upstream outage should still allow site fixes to deploy.
        id: collect
        continue-on-error: true
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          WU_STATIONS: ${{ vars.WU_STATIONS }}
        run: python scripts/collect.py
      - name: Require a valid dataset
        run: python scripts/validate.py
      - name: Check collection freshness
        id: freshness
        continue-on-error: true
        run: python scripts/validate.py --max-age-hours 3
      - name: Record collected data
        run: |
          git config user.name 'weather-atlas[bot]'
          git config user.email 'weather-atlas[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh weather observations and forecasts'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                exit 1
              fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing
        if: ${{ always() && (steps.collect.outcome == 'failure' || steps.freshness.outcome == 'failure') }}
        run: |
          echo 'Weather collection failed. See the collection step; any valid fallback data was still published.'
          exit 1
